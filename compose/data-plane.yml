networks:
  meteorcloud:
    name: meteorcloud

services:
  emqx:
    image: emqx/emqx:5.8.6
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
      # EMQX 5.8 HOCON does not accept getenv() in emqx.conf; override HTTP headers from env.
      EMQX_AUTHENTICATION__1__HEADERS: '{"content-type" = "application/json", "x-mqtt-internal-token" = "${MQTT_INTERNAL_TOKEN:?MQTT_INTERNAL_TOKEN is required}"}'
      EMQX_AUTHORIZATION__SOURCES__1__HEADERS: '{"content-type" = "application/json", "x-mqtt-internal-token" = "${MQTT_INTERNAL_TOKEN:?MQTT_INTERNAL_TOKEN is required}"}'
    ports:
      - "8883:8883"
      - "18083:18083"
    volumes:
      - ./infrastructure/networking/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./certs/ca.crt:/opt/emqx/etc/certs/ca.crt:ro
      - ./certs/server.crt:/opt/emqx/etc/certs/server.crt:ro
      - ./certs/server.key:/opt/emqx/etc/certs/server.key:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "emqx ctl listeners | awk '$$0==\"ssl:default\"{p=1;next} p&&$$0~/^[^[:space:]]/{p=0} p&&/listen_on[[:space:]]*:[[:space:]]*0.0.0.0:8883/{l=1} p&&/running[[:space:]]*:[[:space:]]*true/{r=1} END{exit (l&&r)?0:1}'",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - meteorcloud

  data-plane:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.data-plane
    env_file:
      - .env
    environment:
      CONTROL_PLANE_URL: http://backend:8000
      HTTP_ADDR: ":8081"
      MQTT_ENABLED: "true"
      MQTT_PROVIDER: emqx
      MQTT_BROKER_HOST: emqx
      MQTT_BROKER_PORT: "8883"
      MQTT_PLATFORM_USERNAME: platform
      MQTT_PLATFORM_PASSWORD: ${MQTT_PLATFORM_PASSWORD:-dev-mqtt-platform}
      MQTT_INTERNAL_TOKEN: ${MQTT_INTERNAL_TOKEN:-dev-mqtt-internal}
      MQTT_CA_CERT_PATH: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro
    ports:
      - "8081:8081"
    depends_on:
      emqx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - meteorcloud
