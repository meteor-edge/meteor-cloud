networks:
  meteorcloud:
    name: meteorcloud

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edge}
      POSTGRES_DB: ${POSTGRES_DB:-edge_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/databases/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/02-init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edge} -d ${POSTGRES_DB:-edge_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - meteorcloud

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - meteorcloud

  # S3-compatible object storage for artifacts. The backend talks plain S3, so
  # AWS S3 or another S3 API can replace this without code changes.
  # Official minio/minio is no longer pullable without login. Use a Bitnami
  # build that still embeds the console UI (2025.5+ starts the API only).
  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2024.12.18-debian-12-r1}
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:-meteorcloud}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-meteorcloud-dev-secret}
      MINIO_DEFAULT_BUCKETS: ${OBJECT_STORAGE_BUCKET:-meteorcloud-artifacts}
      # Plain HTTP for local Compose; without these the console never binds.
      MINIO_SCHEME: http
      MINIO_SERVER_URL: http://localhost:${MINIO_API_PORT:-9000}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT:-9001}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - meteorcloud

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edge}:${POSTGRES_PASSWORD:-edge}@postgres:5432/${POSTGRES_DB:-edge_platform}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DATA_PLANE_URL: http://data-plane:8081
      TELEMETRY_PROVIDER: postgresql
      MQTT_ENABLED: "true"
      MQTT_BROKER_HOST: emqx
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-localhost}
      MQTT_BROKER_PORT: "8883"
      MQTT_PLATFORM_USERNAME: platform
      MQTT_PLATFORM_PASSWORD: ${MQTT_PLATFORM_PASSWORD:-dev-mqtt-platform}
      MQTT_INTERNAL_TOKEN: ${MQTT_INTERNAL_TOKEN:-dev-mqtt-internal}
      MQTT_CA_CERT_PATH: /certs/ca.crt
      OBJECT_STORAGE_PROVIDER: s3
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-meteorcloud-artifacts}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-meteorcloud}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-meteorcloud-dev-secret}
    volumes:
      - ./certs:/certs:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - meteorcloud

volumes:
  postgres_data:
  minio_data:
