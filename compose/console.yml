networks:
  meteorcloud:
    name: meteorcloud

services:
  console:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.console.dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    networks:
      - meteorcloud
