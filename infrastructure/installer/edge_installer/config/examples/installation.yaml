installation:
  name: production
  environment: production
  provider: aws
  demo: true   # Demo Organization for the admin login (make up --demo)

platform:
  version: "0.2.0"
  # Public hostname. With aws.dns_zone_id, apply creates <domain>, *.<domain>, wg.<domain>.
  domain: null
  public_url: null

aws:
  region: eu-central-1
  availability_zone: null
  instance_type: auto   # t3.small / medium / large from enabled containers; pin to keep a size
  architecture: amd64
  ami_id: null
  ssh_key_name: edge-platform
  ssh_private_key_path: ~/.ssh/edge-platform.pem
  root_volume_size_gb: 30
  assign_elastic_ip: true
  dns_zone_id: ""   # Route53 hosted zone (Z…). With platform.domain, apply creates the A records.

network:
  allowed_ssh_cidrs:
    - 0.0.0.0/0
  allow_http: true
  allow_https: true

# Enable or disable modular services (default: all on)
services:
  cloud_app:
    enabled: true
  vpn:
    enabled: true
    listen_port: 51820
    network_cidr: 10.8.0.0/24
    allowed_client_cidrs:
      - 0.0.0.0/0
    server_address: 10.8.0.1/24
    # same_host: WireGuard on the cloud_app instance. dedicated: its own EC2
    # instance (instance_type, root_volume_size_gb), linked to the API host.
    placement: same_host

  # Device MQTT. bundled: EMQX on the cloud_app host, TLS on 8883 (self-signed CA,
  # handed to devices with their credentials). external: set broker_host.
  mqtt:
    enabled: true
    broker: bundled
    allowed_client_cidrs:
      - 0.0.0.0/0

components:
  postgres:
    enabled: true
    provider: local
    database_name: edge_platform
    username: edge_platform

  # Only needed for shared rate limits across several API processes.
  redis:
    enabled: false
    provider: local

  reverse_proxy:
    enabled: true
    provider: traefik

deployment:
  repository_url: https://github.com/meteor-edge/meteor-cloud.git
  git_ref: master
  image_source: git
  backend_image: edge-platform-backend:0.2.0
  frontend_image: edge-platform-frontend:0.2.0
  image_pull_policy: never
  health_check_timeout_seconds: 180

secrets:
  source: environment

# Optional Grafana stack (Prometheus, Loki, Alloy, node_exporter).
# aws-up sizes the host up (usually t3.large) when this is on.
# cloudwatch is reserved and not implemented yet.
observability:
  enabled: false
  backend: prometheus
