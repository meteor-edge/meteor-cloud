installation:
  name: production
  environment: production
  provider: aws

platform:
  version: "0.2.0"
  domain: null
  public_url: null

aws:
  region: eu-central-1
  availability_zone: null
  instance_type: t3.small
  architecture: amd64
  ami_id: null
  ssh_key_name: edge-platform
  ssh_private_key_path: ~/.ssh/edge-platform.pem
  root_volume_size_gb: 30
  assign_elastic_ip: true

network:
  allowed_ssh_cidrs:
    - 0.0.0.0/0
  allow_http: true
  allow_https: true

# Enable or disable modular services (default: all on)
services:
  cloud_app:
    enabled: true
  vpn:
    enabled: true
    listen_port: 51820
    network_cidr: 10.8.0.0/24
    allowed_client_cidrs:
      - 0.0.0.0/0
    server_address: 10.8.0.1/24

components:
  postgres:
    enabled: true
    provider: local
    database_name: edge_platform
    username: edge_platform

  redis:
    enabled: true
    provider: local

  reverse_proxy:
    enabled: true
    provider: traefik

deployment:
  repository_url: https://github.com/shahabkamali/MeteorCloud.git
  git_ref: master
  image_source: git
  backend_image: edge-platform-backend:0.2.0
  frontend_image: edge-platform-frontend:0.2.0
  image_pull_policy: never
  health_check_timeout_seconds: 180

secrets:
  source: environment

# Optional Grafana stack (Prometheus, Loki, Alloy, node_exporter).
# Keep false on t3.small. cloudwatch is reserved and not implemented yet.
observability:
  enabled: false
  backend: prometheus
