installation:
  name: __INSTALLATION_NAME__
  environment: staging
  provider: aws

platform:
  version: "0.2.0"
  domain: null
  public_url: null

aws:
  region: __AWS_REGION__
  availability_zone: null
  instance_type: t3.small
  architecture: amd64
  ami_id: null
  ssh_key_name: __SSH_KEY_NAME__
  ssh_private_key_path: __SSH_PRIVATE_KEY_PATH__
  root_volume_size_gb: 30
  assign_elastic_ip: false

network:
  allowed_ssh_cidrs:
    - __SSH_CIDR__
  allow_http: true
  allow_https: true

services:
  cloud_app:
    enabled: true
  vpn:
    enabled: false

components:
  postgres:
    enabled: true
    provider: local
    database_name: edge_platform
    username: edge_platform
  redis:
    enabled: true
    provider: local
  reverse_proxy:
    enabled: true
    provider: traefik

deployment:
  repository_url: __REPOSITORY_URL__
  git_ref: __GIT_REF__
  image_source: git
  backend_image: edge-platform-backend:ci
  frontend_image: edge-platform-frontend:ci
  image_pull_policy: never
  health_check_timeout_seconds: 600

secrets:
  source: environment
