---
- name: Check backend health endpoint
  ansible.builtin.uri:
    url: "{{ platform_public_url }}/health"
    return_content: true
  register: backend_health
  retries: 20
  delay: 5
  until: backend_health.status == 200

- name: Check console root
  ansible.builtin.uri:
    url: "{{ platform_public_url }}/"
  register: frontend_health
  retries: 20
  delay: 5
  until: frontend_health.status == 200
