# Publish meteorcli (agent + runtime only) as a GitHub Release.
# Happens by itself when a merge to master changes the version in
# src/device-plane/agent/pyproject.toml (the workflow creates tag agent-v<version>).
# A hand-pushed tag still works: git tag agent-v0.3.5 && git push origin agent-v0.3.5
name: meteorcli release

on:
  push:
    tags:
      - "agent-v*"
    branches: [master]
    paths:
      - src/device-plane/agent/pyproject.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  release:
    name: Pack and publish meteorcli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/device-plane/agent/pyproject.toml
      - name: Decide the release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(python -c "import tomllib; print(tomllib.load(open('src/device-plane/agent/pyproject.toml', 'rb'))['project']['version'])")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "${tag#agent-v}" != "${ver}" ]]; then
              echo "error: tag ${tag} does not match pyproject version ${ver}" >&2
              exit 1
            fi
          else
            tag="agent-v${ver}"
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "name=${tag}" >> "$GITHUB_OUTPUT"
      - name: Install agent test deps
        if: steps.tag.outputs.skip != 'true'
        run: python -m pip install -e "src/device-plane/agent[dev]"
      - name: Test agent
        if: steps.tag.outputs.skip != 'true'
        working-directory: src/device-plane/agent
        run: python -m pytest -q
      - name: Pack release assets
        if: steps.tag.outputs.skip != 'true'
        run: make agent-dist
      - name: Create GitHub Release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          ver="$(python -c "import tomllib; print(tomllib.load(open('src/device-plane/agent/pyproject.toml', 'rb'))['project']['version'])")"
          gh release create "${TAG}" --target "${GITHUB_SHA}" \
            --title "meteorcli ${ver}" \
            --notes "Device agent only (not the cloud repo). Install:
          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install-meteorcli.sh | bash
          \`\`\`
          First-boot enroll (install + request-token + poll until approved):
          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install-meteorcli-firstboot.sh | sudo bash
          \`\`\`
          Prepare a device to become an OS image (then back it up with Meteor Imager):
          \`\`\`bash
          curl -fsSLO https://github.com/${{ github.repository }}/releases/latest/download/meteorcli-prepare-image.sh && sudo bash meteorcli-prepare-image.sh
          \`\`\`
          Pin a version with \`METEORCLI_VERSION=${ver}\`.
          Update an existing device (checksum, keep the previous install, roll back if the new service does not stay up):
          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/update-meteorcli.sh | sudo bash -s -- --check
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/update-meteorcli.sh | sudo bash -s -- --yes
          \`\`\`" \
            dist/meteorcli.tar.gz \
            "dist/meteorcli-${ver}.tar.gz" \
            dist/install-meteorcli.sh \
            dist/install-meteorcli-firstboot.sh \
            dist/meteorcli-prepare-image.sh \
            dist/update-meteorcli.sh \
            dist/SHA256SUMS
