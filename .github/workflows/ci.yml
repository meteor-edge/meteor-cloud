name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/control-plane
    env:
      # Matches the Postgres service below; the app otherwise reads .env (absent in CI).
      DATABASE_URL: postgresql+psycopg://edge:edge@localhost:5432/edge_platform_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edge
          POSTGRES_PASSWORD: edge
          POSTGRES_DB: edge_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edge -d edge_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/control-plane/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Typecheck (compileall)
        run: python -m compileall app tests scripts
      - name: Test (pytest)
        run: python -m pytest -q

  data-plane:
    name: Data plane (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/data-plane
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/data-plane/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Typecheck (compileall)
        run: python -m compileall data_plane tests
      - name: Test (pytest)
        run: python -m pytest -q

  installer:
    name: Installer (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/installer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infrastructure/installer/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Typecheck (compileall)
        run: python -m compileall edge_installer tests
      - name: Test (pytest)
        run: python -m pytest -q

  agent:
    name: Agent (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/device-plane/agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/device-plane/agent/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Typecheck (compileall)
        run: python -m compileall meteorcli edge_agent tests
      - name: Test (pytest)
        run: python -m pytest -q

  mqtt:
    name: MQTT (local Compose)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/control-plane/pyproject.toml
      - name: Install MQTT test dependencies
        run: python -m pip install pytest paho-mqtt
      - name: MQTT live tests
        env:
          MQTT_COMPOSE_DOWN: "1"
          MQTT_COMPOSE_BUILD: "1"
          MQTT_INTERNAL_TOKEN: mqtt-ci-${{ github.run_id }}
          PYTHONPATH: ${{ github.workspace }}/tests
        run: make test-mqtt

  infra:
    name: Terraform / Ansible
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Install Ansible
        run: python -m pip install ansible
      - name: Terraform check
        run: make terraform-check
      - name: Ansible check
        run: make ansible-check
