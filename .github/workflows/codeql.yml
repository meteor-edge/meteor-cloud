# Static security analysis (GitHub CodeQL). Results show under Security > Code scanning.
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@v5
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: src/data-plane/go/go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      # The data plane binaries. The Mosquitto auth plugin is cgo against broker headers
      # and is covered by its own tests, not by this build.
      - if: matrix.build-mode == 'manual'
        working-directory: src/data-plane/go
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
