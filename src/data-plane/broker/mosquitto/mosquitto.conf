# MeteorCloud bundled MQTT broker (Eclipse Mosquitto).
#
# Security model:
#   * TLS only on 8883. There is no plain TCP or WebSocket listener.
#   * No anonymous clients. Every login and every publish/subscribe is decided
#     by the control plane through the meteorcloud_auth plugin (no local
#     password or ACL files). If the control plane is unreachable the answer
#     is "deny".
#   * The plugin reads CONTROL_PLANE_URL and MQTT_INTERNAL_TOKEN from the
#     environment, so no secret is written in this file.
#
# To tune limits, mount your own copy over /mosquitto/config/mosquitto.conf.

per_listener_settings false
allow_anonymous false

# Sessions and retained status survive a broker restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Limits: one device cannot exhaust the broker.
max_packet_size 262144
max_inflight_messages 20
max_queued_messages 1000
max_keepalive 600
# Drop a client id's old session state after a week offline.
persistent_client_expiration 7d

listener 8883
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# TLS 1.2 and 1.3 only (Mosquitto's default when tls_version is unset).
# Devices verify the broker with the CA they received at enrollment; they
# authenticate with their per-device username and password.
require_certificate false

plugin /usr/lib/mosquitto/meteorcloud_auth.so
