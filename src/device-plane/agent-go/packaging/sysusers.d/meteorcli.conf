# Users and groups for meteorcli (systemd-sysusers).
# meteor runs the agent. meteorcli may read status and logs through agent.sock;
# meteorcli-admin may also enroll, change config, update and restart modules.
# agent.sock belongs to meteorcli, so add administrators to both groups:
#   usermod -aG meteorcli,meteorcli-admin <user>
u meteor - "MeteorCloud device agent" /var/lib/meteorcli /usr/sbin/nologin
g meteorcli -
g meteorcli-admin -
m meteor meteorcli
