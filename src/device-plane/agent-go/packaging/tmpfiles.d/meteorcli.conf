# Directories for meteorcli (systemd-tmpfiles). Layout: docs/meteorcli-go.md.
d /etc/meteorcli                0755 root   root      -
d /var/lib/meteorcli            0755 meteor meteor    -
d /var/lib/meteorcli/identity   0700 meteor meteor    -
d /var/lib/meteorcli/state      0700 meteor meteor    -
d /var/lib/meteorcli/artifacts  0750 meteor meteor    -
# agent.sock (meteor:meteorcli 0660) and helper.sock (root:meteor 0660) live here.
d /run/meteorcli                0750 meteor meteorcli -
