[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-platform-backend"
version = "0.1.0"
description = "Edge Platform control-plane backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt>=4.2.0",
  "email-validator>=2.2.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.0",
  "redis>=5.0.0",
  "python-multipart>=0.0.20",
  "boto3>=1.36.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx2>=2.0.0",
  "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
