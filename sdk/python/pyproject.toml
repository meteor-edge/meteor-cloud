[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meteorcloud"
version = "0.1.0"
description = "MeteorCloud SDK: publish, subscribe to and query data from edge and cloud applications"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13,<18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meteorcloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
