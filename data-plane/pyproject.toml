[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meteorcloud-data-plane"
version = "0.1.0"
description = "MeteorCloud data-plane MQTT gateway"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "paho-mqtt>=2.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
  "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["data_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["data_plane"]
