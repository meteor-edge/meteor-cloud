---
- name: Install device packages
  ansible.builtin.package:
    name:
      - curl
      - openssh-server
      - wireguard-tools
      - iptables
    state: present

# meteorcli manages wg0 itself (wg-quick); devices never forward traffic.
- name: Load the WireGuard kernel module at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/wireguard.conf
    content: "wireguard\n"
    owner: root
    group: root
    mode: "0644"

- name: Load the WireGuard kernel module now
  community.general.modprobe:
    name: wireguard
    state: present

# Ubuntu 24.04+ uses ssh.socket; Debian uses ssh.service; RHEL uses sshd.service.
- name: Find sshd unit
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/lib/systemd/system/ssh.socket
    - /usr/lib/systemd/system/sshd.service
    - /usr/lib/systemd/system/ssh.service
  register: device_sshd_units

- name: Enable sshd for browser SSH over WireGuard
  ansible.builtin.systemd_service:
    name: "{{ (device_sshd_units.results | selectattr('stat.exists') | map(attribute='item') | first | basename) }}"
    state: started
    enabled: true

- name: Create the meteorcli release directory
  ansible.builtin.file:
    path: "{{ device_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: device_dist_archive | length > 0

- name: Copy the meteorcli release files
  ansible.builtin.copy:
    src: "{{ device_dist_archive }}"
    dest: "{{ device_install_dir }}.tar.gz"
    owner: root
    group: root
    mode: "0644"
  register: device_dist_copy
  when: device_dist_archive | length > 0

- name: Unpack the meteorcli release files
  ansible.builtin.unarchive:
    src: "{{ device_install_dir }}.tar.gz"
    dest: "{{ device_install_dir }}"
    remote_src: true
  when: device_dist_archive | length > 0 and device_dist_copy is changed

- name: Check for an installed meteorcli
  ansible.builtin.stat:
    path: /usr/local/bin/meteorcli
  register: device_cli

# install-meteorcli.sh installs the binary, units, users and directories, adds the SSH user to
# meteorcli and meteorcli-admin, and starts the agent (it enrolls once registered).
- name: Install meteorcli
  ansible.builtin.command:
    argv: "{{ ['bash', device_install_dir ~ '/install-meteorcli.sh', '--base-url', 'file://' ~ device_install_dir]
              + (['--user', device_ssh_user] if device_ssh_user | length > 0 else []) }}"
  when: device_dist_archive | length > 0 and (not device_cli.stat.exists or device_dist_copy is changed)
  changed_when: true

- name: Install meteorcli from the published release
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl -fsSL {{ device_release_url }}/install-meteorcli.sh |
      bash -s -- {{ ('--user ' ~ (device_ssh_user | quote)) if device_ssh_user | length > 0 else '' }}
    executable: /bin/bash
  when: device_dist_archive | length == 0 and not device_cli.stat.exists
  changed_when: true
