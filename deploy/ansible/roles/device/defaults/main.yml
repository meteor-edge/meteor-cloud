---
# Device host prepared for `meteorcli` (playbooks/device.yml): Docker, WireGuard tools,
# sshd for browser SSH, and the Go meteorcli (meteorcli.service + meteorcli-helper.socket).
# Registration is not done here: run `sudo meteorcli config --api-base …` and
# `meteorcli register --token-file …` (the E2E suite does).
# Release files: a controller .tar.gz of `make agent-go-dist` output (device_dist_archive),
# else the published release (device_release_url).
device_dist_archive: ""
device_release_url: https://github.com/meteor-edge/meteor-cloud/releases/latest/download
device_install_dir: /opt/meteorcli-dist
# The account the console's browser terminal signs in as; it may also run meteorcli without sudo.
device_ssh_user: "{{ ansible_user | default('') }}"
