---
# WireGuard gateway: wg0, the peer agent, and static site-link peers on a
# dedicated gateway. Runs on vpn_gateway_hosts; see playbooks/services/vpn.yml.
- name: Check WireGuard gateway settings
  ansible.builtin.assert:
    that:
      - not (vpn_standalone | bool) or vpn_gateway_hosts | length == 1
      - vpn_server_private_key | length > 0 or vpn_generate_server_key | bool
      - connectivity_internal_token | length > 0
      - vpn_managed_api_hosts | length > 0 or vpn_control_plane_url | length > 0
      - >-
        vpn_managed_api_hosts | map('extract', hostvars, 'vpn_link_public_key') | select('defined') | list | length
        == vpn_managed_api_hosts | length
      - vpn_site_links | rejectattr('public_key', 'defined') | list | length == 0
      - vpn_site_links | map(attribute='public_key') | reject('match', '^[A-Za-z0-9+/]{43}=$') | list | length == 0
      - >-
        vpn_site_links | map(attribute='address') | map('regex_replace', '\.\d+$', '') | reject('equalto', vpn_link_prefix)
        | list | length == 0
    fail_msg: >-
      WireGuard gateway: use exactly one host in the vpn_gateway group; set EDGE_PLATFORM_VPN_SERVER_PRIVATE_KEY
      or keep vpn_generate_server_key; set EDGE_PLATFORM_CONNECTIVITY_INTERNAL_TOKEN (or
      EDGE_PLATFORM_MQTT_INTERNAL_TOKEN); with no `platform` hosts set vpn_control_plane_url; give every
      vpn_site_links entry a WireGuard public_key (wg pubkey output) and an address inside vpn_link_subnet ({{ vpn_link_subnet }}).
      Run without --limit so the API hosts' site-link keys are known.
    quiet: true

- name: Install WireGuard requirements
  ansible.builtin.include_tasks: packages.yml
  vars:
    vpn_sysctl:
      net.ipv4.ip_forward: 1

- name: Install the provided server private key
  ansible.builtin.copy:
    dest: /etc/wireguard/server.key
    content: "{{ vpn_server_private_key | trim }}\n"
    owner: root
    group: root
    mode: "0600"
  notify: Restart wireguard
  no_log: true
  when: vpn_server_private_key | length > 0

- name: Generate a server private key once
  ansible.builtin.shell:
    cmd: umask 077 && wg genkey > /etc/wireguard/server.key
    creates: /etc/wireguard/server.key
  when: vpn_server_private_key | length == 0

- name: Derive the server public key
  ansible.builtin.shell:
    cmd: wg pubkey < /etc/wireguard/server.key
  register: vpn_server_pubkey
  changed_when: false

- name: Remember the server public key
  ansible.builtin.set_fact:
    vpn_server_public_key: "{{ vpn_server_pubkey.stdout | trim }}"

# Managed API hosts read this file (platform_config) to enable CONNECTIVITY_PROVIDER.
- name: Publish the server public key
  ansible.builtin.copy:
    dest: /etc/wireguard/server.pub
    content: "{{ vpn_server_public_key }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Render WireGuard server configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart wireguard

- name: Enable and start WireGuard interface
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started

- name: Ensure gateway directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/meteorcloud/gateway, mode: "0755" }
    - { path: /etc/meteorcloud, mode: "0700" }

- name: Install gateway peer agent
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../src/device-plane/gateway/connectivity_agent.py"
    dest: /opt/meteorcloud/gateway/connectivity_agent.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart meteorcloud gateway

- name: Render gateway environment
  ansible.builtin.template:
    src: gateway.env.j2
    dest: /etc/meteorcloud/gateway.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart meteorcloud gateway
  no_log: true

- name: Install gateway systemd unit
  ansible.builtin.template:
    src: meteorcloud-gateway.service.j2
    dest: /etc/systemd/system/meteorcloud-gateway.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart meteorcloud gateway

# Retries every 15s until the API answers (on a fresh host it starts after this play).
- name: Enable and start gateway agent
  ansible.builtin.systemd:
    name: meteorcloud-gateway
    enabled: true
    state: started
    daemon_reload: true
