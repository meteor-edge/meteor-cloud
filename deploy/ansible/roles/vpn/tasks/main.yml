---
- name: Install WireGuard
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
      - python3
    state: present
    update_cache: true

- name: Ensure WireGuard config directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Derive WireGuard server public key
  ansible.builtin.command:
    cmd: wg pubkey
    stdin: "{{ vpn_server_private_key }}"
  register: wg_derived_pub
  changed_when: false
  no_log: true
  when:
    - vpn_server_private_key | default('') | length > 0
    - wireguard_server_public_key | default('') | length == 0

- name: Remember WireGuard server public key
  ansible.builtin.set_fact:
    wireguard_server_public_key: "{{ wg_derived_pub.stdout | trim }}"
  when: wg_derived_pub.stdout | default('') | length > 0

- name: Render WireGuard server configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart wireguard
  when: vpn_server_private_key | default('') | length > 0

- name: Enable and start WireGuard interface
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
  when: vpn_server_private_key | default('') | length > 0

- name: Ensure gateway directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/meteorcloud/gateway, mode: "0755" }
    - { path: /etc/meteorcloud, mode: "0700" }
  when: vpn_server_private_key | default('') | length > 0

- name: Install gateway peer agent
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../src/device-plane/gateway/connectivity_agent.py"
    dest: /opt/meteorcloud/gateway/connectivity_agent.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart meteorcloud gateway
  when: vpn_server_private_key | default('') | length > 0

- name: Render gateway environment
  ansible.builtin.template:
    src: gateway.env.j2
    dest: /etc/meteorcloud/gateway.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart meteorcloud gateway
  no_log: true
  when: vpn_server_private_key | default('') | length > 0

- name: Install gateway systemd unit
  ansible.builtin.template:
    src: meteorcloud-gateway.service.j2
    dest: /etc/systemd/system/meteorcloud-gateway.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart meteorcloud gateway
  when: vpn_server_private_key | default('') | length > 0

- name: Enable and start gateway agent
  ansible.builtin.systemd:
    name: meteorcloud-gateway
    enabled: true
    state: started
    daemon_reload: true
  when: vpn_server_private_key | default('') | length > 0

- name: Write WireGuard settings into Compose env
  ansible.builtin.lineinfile:
    path: "{{ platform_compose_dir }}/.env"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^CONNECTIVITY_PROVIDER=', line: 'CONNECTIVITY_PROVIDER=wireguard' }
    - { regexp: '^WIREGUARD_SERVER_PUBLIC_KEY=', line: 'WIREGUARD_SERVER_PUBLIC_KEY="{{ wireguard_server_public_key }}"' }
    - regexp: '^WIREGUARD_SERVER_ENDPOINT='
      line: >-
        WIREGUARD_SERVER_ENDPOINT={{ wireguard_server_endpoint
        | default(ansible_host ~ ":" ~ (listen_port | default(51820)), true) }}
  no_log: true
  when:
    - vpn_server_private_key | default('') | length > 0
    - wireguard_server_public_key | default('') | length > 0
    - platform_compose_dir is defined

- name: Recreate API with WireGuard settings
  ansible.builtin.command:
    cmd: >-
      docker compose -f docker-compose.yml -f docker-compose.prod.yml
      up -d --no-deps backend
    chdir: "{{ platform_compose_dir }}"
  changed_when: true
  when:
    - vpn_server_private_key | default('') | length > 0
    - wireguard_server_public_key | default('') | length > 0
    - platform_compose_dir is defined

- name: Note when VPN keys are not configured
  ansible.builtin.debug:
    msg: >-
      WireGuard packages installed. Set EDGE_PLATFORM_VPN_SERVER_PRIVATE_KEY and re-run deploy
      to activate the tunnel.
  when: vpn_server_private_key | default('') | length == 0
