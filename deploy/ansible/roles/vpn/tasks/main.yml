---
- name: Install WireGuard
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true

- name: Ensure WireGuard config directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render WireGuard server configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart wireguard
  when: vpn_server_private_key | default('') | length > 0

- name: Enable and start WireGuard interface
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
  when: vpn_server_private_key | default('') | length > 0

- name: Note when VPN keys are not configured
  ansible.builtin.debug:
    msg: >-
      WireGuard packages installed. Set EDGE_PLATFORM_VPN_SERVER_PRIVATE_KEY and re-run deploy
      to activate the tunnel.
  when: vpn_server_private_key | default('') | length == 0
