---
- name: Check for a supported operating system
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
      - ansible_distribution in ['Ubuntu', 'Debian', 'CentOS', 'Rocky', 'AlmaLinux', 'RedHat']
      - ansible_os_family != 'Debian' or ansible_distribution_major_version | int >= (22 if ansible_distribution == 'Ubuntu' else 12)
      - ansible_os_family != 'RedHat' or ansible_distribution_major_version | int >= 9
    fail_msg: >-
      MeteorCloud host setup supports Ubuntu 22.04+, Debian 12+, and RHEL/CentOS/Rocky/AlmaLinux 9+
      (found {{ ansible_distribution }} {{ ansible_distribution_version }}).
    quiet: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_pkg_mgr == 'apt'

- name: Install common packages
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - git
      - openssl
    state: present

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC
