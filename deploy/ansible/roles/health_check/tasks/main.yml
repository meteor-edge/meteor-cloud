---
# Runs on the host itself so it also works when the controller cannot reach the
# public URL (private networks, on-prem). Set health_check_url to override.
- name: Set the entry point URL
  ansible.builtin.set_fact:
    platform_health_url: "{{ health_check_url | default(('https://127.0.0.1:' ~ https_port) if platform_domain else ('http://127.0.0.1:' ~ http_port)) }}"

- name: Check API health through the entry point
  ansible.builtin.uri:
    url: "{{ platform_health_url }}/health"
    validate_certs: false
  register: backend_health
  retries: 20
  delay: 5
  until: backend_health.status == 200

- name: Check console through the entry point
  ansible.builtin.uri:
    url: "{{ platform_health_url }}/"
    validate_certs: false
  register: frontend_health
  retries: 20
  delay: 5
  until: frontend_health.status == 200


# A checklist for whoever owns the DNS zone. Plain A records ("DNS only": no HTTP proxy).
- name: Show the DNS records this installation needs
  ansible.builtin.debug:
    msg: "{{ dns_web + (dns_wireguard if 'vpn' in enabled_services else []) }}"
  vars:
    dns_ip: "{{ public_ipv4 | default(ansible_host) | default(inventory_hostname) }} (this server's public IP)"
    dns_web:
      - "DNS records MeteorCloud needs (A records, DNS only, TTL 60-300s):"
      - "{{ platform_domain }}  ->  {{ dns_ip }}   console, API (/api), MQTT (TCP 8883)"
      - "*.{{ apps_base_domain }}  ->  {{ dns_ip }}   public app URLs"
    dns_wg_host: "{{ vpn_gateway_endpoint | trim | regex_replace(':[0-9]+$', '') }}"
    dns_wg_ip: "{{ hostvars[vpn_gateway_host].public_ipv4 | default(hostvars[vpn_gateway_host].ansible_host) | default(vpn_gateway_host) }} (WireGuard server's public IP)"
    dns_wireguard: "{{ [dns_wg_named] if dns_wg_host is not match('^[0-9.]+$') else [dns_wg_by_ip] }}"
    dns_wg_named: "{{ dns_wg_host }}  ->  {{ dns_wg_ip }}   WireGuard: devices connect here (UDP {{ vpn_listen_port }})"
    dns_wg_by_ip: >-
      WireGuard: devices dial the IP {{ dns_wg_host }}. Better: create vpn.{{ platform_domain }} -> {{ dns_wg_ip }}
      and set vpn_public_host: vpn.{{ platform_domain }} on that host, so devices follow an IP change.
  when: platform_domain | length > 0
