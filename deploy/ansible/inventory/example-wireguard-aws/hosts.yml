---
# WireGuard gateway on an existing AWS EC2 instance (Ubuntu/Debian or RHEL/Rocky/Alma 9+).
# Copy to inventory/<name>/, edit, then:
#   export EDGE_PLATFORM_CONNECTIVITY_INTERNAL_TOKEN=...   # same value as the control plane
#   ansible-playbook -i inventory/<name>/hosts.yml playbooks/wireguard.yml
# Security group: allow UDP 51820 from anywhere (devices) and SSH from your network.
all:
  children:
    vpn_gateway:
      hosts:
        wg-gateway-aws:
          ansible_host: 198.51.100.20          # Elastic IP, or a private IP over a bastion/VPN
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/meteorcloud.pem
          vpn_public_host: wg.example.com      # Elastic IP or DNS name devices dial
    # Uncomment when Ansible also manages the API host (Compose); a site link is set up
    # automatically and vpn_control_plane_url is not needed.
    # platform:
    #   hosts:
    #     meteorcloud-1:
    #       ansible_host: 203.0.113.10
    #       ansible_user: ubuntu
