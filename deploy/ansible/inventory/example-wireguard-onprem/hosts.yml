---
# WireGuard gateway on an on-prem server or VM (Ubuntu/Debian or RHEL/Rocky/Alma 9+).
# Copy to inventory/<name>/, edit, then:
#   export EDGE_PLATFORM_CONNECTIVITY_INTERNAL_TOKEN=...   # same value as the control plane
#   ansible-playbook -i inventory/<name>/hosts.yml playbooks/wireguard.yml
# Router: forward UDP 51820 from the public address to this server.
all:
  children:
    vpn_gateway:
      hosts:
        wg-gateway-onprem:
          ansible_host: 192.168.10.20
          ansible_user: admin
          vpn_public_host: vpn.example.com     # public IP or DNS of the router
          # vpn_egress_interface: ens18        # only if the default-route NIC is wrong
