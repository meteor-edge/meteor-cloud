# Traefik dynamic configuration (Go template, rendered by Traefik's file provider).
# PLATFORM_DOMAIN set: HTTPS with a Let's Encrypt certificate and HTTP->HTTPS redirect.
# PLATFORM_DOMAIN empty: plain HTTP on port 80.
# Only /api and /health reach the API; /internal and /metrics stay private.
# /v1 reaches the application data API (profile data-api): its public listener only.
# REGISTRY_PUBLIC_HOST set: that host goes to the container registry (profile registry).
{{ $domain := env "PLATFORM_DOMAIN" }}
{{ $registry := env "REGISTRY_PUBLIC_HOST" }}
http:
  routers:
    backend:
      rule: "PathPrefix(`/health`) || PathPrefix(`/api`)"
      service: backend
      priority: 10
{{- if $domain }}
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
        domains:
          - main: "{{ $domain }}"
{{- else }}
      entryPoints: [web]
{{- end }}
    data-api:
      rule: "PathPrefix(`/v1/`)"
      service: data-api
      priority: 10
{{- if $domain }}
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
        domains:
          - main: "{{ $domain }}"
{{- else }}
      entryPoints: [web]
{{- end }}
{{- if $registry }}
    registry:
      rule: "Host(`{{ $registry }}`) && PathPrefix(`/v2`)"
      service: registry
      priority: 50
{{- if $domain }}
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
        domains:
          - main: "{{ $registry }}"
{{- else }}
      entryPoints: [web]
{{- end }}
{{- end }}
    console:
      rule: "PathPrefix(`/`)"
      service: console
      priority: 1
{{- if $domain }}
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
        domains:
          - main: "{{ $domain }}"
    http-redirect:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: console
      priority: 100

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true
{{- else }}
      entryPoints: [web]
{{- end }}

  services:
    backend:
      loadBalancer:
        servers:
          - url: http://backend:8000
    data-api:
      loadBalancer:
        servers:
          - url: http://data-api:8082
{{- if $registry }}
    registry:
      loadBalancer:
        servers:
          - url: http://registry:5000
{{- end }}
    console:
      loadBalancer:
        servers:
          - url: http://console:80
