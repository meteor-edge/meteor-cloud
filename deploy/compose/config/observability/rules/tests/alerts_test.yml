# promtool test rules tests/alerts_test.yml  (run by `make observability-check`)
rule_files:
  - ../recording.yml
  - ../alerts.yml

evaluation_interval: 1m

tests:
  # A real error spike pages within ~3 minutes.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/x",status="200"}'
        values: '0+60x20'
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/x",status="500"}'
        values: '0+6x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: APIHighErrorRate
        exp_alerts: []
      - eval_time: 4m
        alertname: APIHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: public
            exp_annotations:
              summary: "More than 1% of API requests are failing with 5xx"
              description: "9.091% of public API requests returned 5xx over the last 5 minutes."
              runbook: "docs/observability.md#apihigherrorrate"

  # One 500 on a quiet install is not an incident.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/x",status="200"}'
        values: '0+3x20'
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/x",status="500"}'
        values: '0x5 1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: APIHighErrorRate
        exp_alerts: []
      - eval_time: 10m
        alertname: APIErrorBurst
        exp_alerts: []

  # Internal (EMQX auth) failures do not count toward the public error rate.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",method="POST",path="/internal/mqtt/authenticate",status="500"}'
        values: '0+60x20'
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/x",status="200"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: APIHighErrorRate
        exp_alerts: []

  # Slow artifact uploads and downloads do not trip the latency alert...
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{job="backend",method="POST",path="/api/v1/organizations/{organization_id}/artifacts",le="0.5"}'
        values: '0x30'
      - series: 'http_request_duration_seconds_bucket{job="backend",method="POST",path="/api/v1/organizations/{organization_id}/artifacts",le="10"}'
        values: '0+600x30'
      - series: 'http_request_duration_seconds_bucket{job="backend",method="POST",path="/api/v1/organizations/{organization_id}/artifacts",le="+Inf"}'
        values: '0+600x30'
      - series: 'http_request_duration_seconds_bucket{job="backend",method="GET",path="/api/v1/agent/artifacts/{artifact_id}/download",le="0.5"}'
        values: '0x30'
      - series: 'http_request_duration_seconds_bucket{job="backend",method="GET",path="/api/v1/agent/artifacts/{artifact_id}/download",le="+Inf"}'
        values: '0+600x30'
      - series: 'http_request_duration_seconds_bucket{job="backend",method="GET",path="/api/v1/x",le="0.5"}'
        values: '0+60x30'
      - series: 'http_request_duration_seconds_bucket{job="backend",method="GET",path="/api/v1/x",le="10"}'
        values: '0+60x30'
      - series: 'http_request_duration_seconds_bucket{job="backend",method="GET",path="/api/v1/x",le="+Inf"}'
        values: '0+60x30'
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/x",status="200"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: APIHighLatency
        exp_alerts: []

  # ...but a slow regular API route does.
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{job="backend",method="GET",path="/api/v1/x",le="0.5"}'
        values: '0x30'
      - series: 'http_request_duration_seconds_bucket{job="backend",method="GET",path="/api/v1/x",le="10"}'
        values: '0+60x30'
      - series: 'http_request_duration_seconds_bucket{job="backend",method="GET",path="/api/v1/x",le="+Inf"}'
        values: '0+60x30'
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/x",status="200"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: APIHighLatency
        exp_alerts:
          - exp_labels:
              severity: warning
              scope: public
            exp_annotations:
              summary: "API p95 latency above 2s"
              description: "p95 latency of public API requests is 9.525s (uploads, downloads and streams excluded)."
              runbook: "docs/observability.md#apihighlatency"

  # The control plane stops answering scrapes.
  - interval: 1m
    input_series:
      - series: 'up{job="backend",instance="backend:8000"}'
        values: '1 1 0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: ControlPlaneDown
        exp_alerts: []
      - eval_time: 4m
        alertname: ControlPlaneDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              instance: backend:8000
            exp_annotations:
              summary: "Control plane API is not answering scrapes"
              description: "Prometheus cannot scrape the control plane /metrics endpoint."
              runbook: "docs/observability.md#controlplanedown"

  # A fleet that is mostly offline by design does not alert; a sudden drop does.
  - interval: 1m
    input_series:
      - series: 'meteorcloud_devices{state="online",instance="a"}'
        values: '20x30'
      - series: 'meteorcloud_devices{state="offline",instance="a"}'
        values: '80x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: FleetOfflineSpike
        exp_alerts: []
  - interval: 1m
    input_series:
      # Two replicas report the same totals; max() keeps them from doubling.
      - series: 'meteorcloud_devices{state="online",instance="a"}'
        values: '70x10 50x20'
      - series: 'meteorcloud_devices{state="offline",instance="a"}'
        values: '10x10 30x20'
      - series: 'meteorcloud_devices{state="online",instance="b"}'
        values: '70x10 50x20'
      - series: 'meteorcloud_devices{state="offline",instance="b"}'
        values: '10x10 30x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: FleetOfflineSpike
        exp_alerts: []
      - eval_time: 17m
        alertname: FleetOfflineSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Many devices went offline at once"
              description: "More than 30% of seen devices are offline and more than 5 dropped off in the last 10 minutes."
              runbook: "docs/observability.md#fleetofflinespike"

  # A failed Deploy is reported.
  - interval: 1m
    input_series:
      - series: 'meteorcloud_deployments_finished_total{status="failed",instance="a"}'
        values: '0x5 1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: DeploymentFailures
        exp_alerts: []
      - eval_time: 8m
        alertname: DeploymentFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "A Deploy failed in the last hour"
              description: "1 Deploy(s) finished as failed in the last hour."
              runbook: "docs/observability.md#deploymentfailures"

  # The data plane loses its broker connection.
  - interval: 1m
    input_series:
      - series: 'meteorcloud_dataplane_mqtt_connected{instance="dp"}'
        values: '1 1 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: DataPlaneMqttDisconnected
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Data plane is not connected to the MQTT broker"
              description: "No device status, metrics or command results are reaching the control plane."
              runbook: "docs/observability.md#dataplanemqttdisconnected"

  # The API answers scrapes but cannot reach PostgreSQL.
  - interval: 1m
    input_series:
      - series: 'meteorcloud_database_up{instance="a"}'
        values: '1 1 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: DatabaseDown
        exp_alerts: []
      - eval_time: 5m
        alertname: DatabaseDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Control plane cannot reach PostgreSQL"
              description: "The API answers scrapes but its fleet query fails: logins, heartbeats and Deploys are failing."
              runbook: "docs/observability.md#databasedown"
  # With fleet metrics switched off the gauge is absent, which is not an outage.
  - interval: 1m
    input_series:
      - series: 'up{job="backend",instance="backend:8000"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: DatabaseDown
        exp_alerts: []

  # Repeated crashes alert; a few do not.
  - interval: 1m
    input_series:
      - series: 'meteorcloud_unhandled_exceptions_total{instance="a"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: UnhandledExceptions
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Control plane requests are crashing"
              description: "10 requests ended in an unhandled exception in the last 10 minutes."
              runbook: "docs/observability.md#unhandledexceptions"
  - interval: 1m
    input_series:
      - series: 'meteorcloud_unhandled_exceptions_total{instance="a"}'
        values: '0x5 3x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: UnhandledExceptions
        exp_alerts: []

  # A Deploy left paused for half an hour is reported once (replicas report the same total).
  - interval: 1m
    input_series:
      - series: 'meteorcloud_deployments{status="paused",instance="a"}'
        values: '1x40'
      - series: 'meteorcloud_deployments{status="paused",instance="b"}'
        values: '1x40'
      - series: 'meteorcloud_deployments{status="in_progress",instance="a"}'
        values: '3x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: DeployPaused
        exp_alerts: []
      - eval_time: 35m
        alertname: DeployPaused
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "A Deploy has been paused for 30 minutes"
              description: "1 Deploy(s) are paused, by an operator or by their failure threshold."
              runbook: "docs/observability.md#deploypaused"

  # The rollout sweeper failing on every pass alerts; a one-off failure does not.
  - interval: 1m
    input_series:
      - series: 'meteorcloud_deploy_sweep_ticks_total{result="error",instance="a"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: DeploySweeperFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The rollout sweeper keeps failing"
              description: "15 Deploy ticks failed in 15 minutes: batched and phased rollouts may be stuck."
              runbook: "docs/observability.md#deploysweeperfailing"
  - interval: 1m
    input_series:
      - series: 'meteorcloud_deploy_sweep_ticks_total{result="error",instance="a"}'
        values: '0x5 2x15'
    alert_rule_test:
      - eval_time: 16m
        alertname: DeploySweeperFailing
        exp_alerts: []

  # Password guessing on the console login.
  - interval: 1m
    input_series:
      - series: 'meteorcloud_auth_logins_total{result="failure",instance="a"}'
        values: '0+3x20'
      - series: 'meteorcloud_auth_logins_total{result="success",instance="a"}'
        values: '0+50x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LoginFailureSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Many failed console logins"
              description: "30 console logins failed in the last 10 minutes (possible password guessing)."
              runbook: "docs/observability.md#loginfailurespike"
  - interval: 1m
    input_series:
      - series: 'meteorcloud_auth_logins_total{result="failure",instance="a"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LoginFailureSpike
        exp_alerts: []

  # Sustained MQTT auth denials alert; a revoked device retrying now and then does not.
  - interval: 1m
    input_series:
      - series: 'meteorcloud_mqtt_auth_total{action="authenticate",result="deny",instance="a"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MqttAuthDenySpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The MQTT broker is denying many clients"
              description: "1 MQTT auth decisions/s are deny (revoked devices retrying, or someone probing the broker)."
              runbook: "docs/observability.md#mqttauthdenyspike"
  - interval: 1m
    input_series:
      - series: 'meteorcloud_mqtt_auth_total{action="authenticate",result="deny",instance="a"}'
        values: '0+6x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MqttAuthDenySpike
        exp_alerts: []

  # Many registrations with a bad token point to a leaked or guessed token.
  - interval: 1m
    input_series:
      - series: 'meteorcloud_device_registrations_total{result="invalid_token",instance="a"}'
        values: '0+2x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: InvalidRegistrationTokens
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Many device registrations with invalid tokens"
              description: "30 registrations used an invalid, expired or revoked token in 15 minutes."
              runbook: "docs/observability.md#invalidregistrationtokens"

  # The pipeline heartbeat always fires.
  - interval: 1m
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "Always firing; proves the alert pipeline works"
              description: "Route this to a dead-man's-switch receiver. If it stops arriving, alerting is broken."
              runbook: "docs/observability.md#watchdog"

  # The error ratio reads 0 (not "no data") before the first 5xx.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/x",status="200"}'
        values: '0+60x20'
    promql_expr_test:
      - expr: meteorcloud:http_5xx:ratio5m{scope="public"}
        eval_time: 10m
        exp_samples:
          - labels: 'meteorcloud:http_5xx:ratio5m{scope="public"}'
            value: 0
