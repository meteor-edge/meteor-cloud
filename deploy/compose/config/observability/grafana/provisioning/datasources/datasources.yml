apiVersion: 1
# Dashboards refer to these uids only, so any Prometheus- or Loki-compatible backend can
# replace the bundled ones by changing PROMETHEUS_URL / LOKI_URL on the grafana service.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: ${LOKI_URL}
