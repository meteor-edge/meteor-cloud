global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: edge-platform-backend

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node
