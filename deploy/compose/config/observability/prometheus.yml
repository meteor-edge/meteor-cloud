# Scrape targets for the optional observability stack. The app only exposes /metrics;
# it never connects here. Any Prometheus-compatible scraper can replace this file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager is optional (alerting profile). DNS discovery means no errors when it is off;
# to use an external Alertmanager, replace this block with its address.
alerting:
  alertmanagers:
    - dns_sd_configs:
        - names: ["alertmanager"]
          type: A
          port: 9093

rule_files:
  - /etc/prometheus/rules/recording.yml
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: edge-platform-backend

  # The data plane only runs with the mqtt profile. DNS discovery finds it when it runs and
  # yields no target (and no alert) when it is not part of this install.
  - job_name: data-plane
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["data-plane"]
        type: A
        port: 8081
    relabel_configs:
      - target_label: service
        replacement: data-plane

  # Device event path (nats profile): JetStream and its services. DNS discovery, so
  # nothing is scraped (and nothing alerts) when the profile is off.
  - job_name: device-ingest
    dns_sd_configs:
      - names: ["device-ingest"]
        type: A
        port: 8093
    relabel_configs:
      - target_label: service
        replacement: device-ingest

  - job_name: rule-processor
    dns_sd_configs:
      - names: ["rule-processor"]
        type: A
        port: 8094
    relabel_configs:
      - target_label: service
        replacement: rule-processor

  - job_name: clickhouse-writer
    dns_sd_configs:
      - names: ["clickhouse-writer"]
        type: A
        port: 8095
    relabel_configs:
      - target_label: service
        replacement: clickhouse-writer

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  - job_name: alertmanager
    dns_sd_configs:
      - names: ["alertmanager"]
        type: A
        port: 9093
    relabel_configs:
      - target_label: service
        replacement: alertmanager
