# Alertmanager config that delivers every alert to one generic webhook (Alertmanager's
# standard JSON payload, so any compatible receiver works). The URL is read from a file so it
# never lands in this repository: <ALERTMANAGER_SECRETS_DIR>/webhook_url.
# Selected with ALERTMANAGER_CONFIG=alertmanager.webhook.yml (Ansible does this when
# observability_alert_webhook_url is set).
route:
  receiver: webhook
  group_by: [alertname, scope]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Watchdog always fires. Send it to a dead-man's-switch service instead of the main
    # webhook by adding a receiver here (see docs/observability.md#watchdog).
    - matchers: [alertname="Watchdog"]
      receiver: "null"

receivers:
  - name: "null"
  - name: webhook
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true

inhibit_rules:
  - source_matchers: [alertname="ControlPlaneDown"]
    target_matchers: [alertname=~"APIHighErrorRate|APIErrorBurst|APIHighLatency"]
