# NATS JetStream for the MeteorCloud data plane (docs/data-plane/jetstream.md).
#
# Internal only: devices never connect here. Every data-plane service has its own
# user, limited to the subjects it needs. Passwords come from the environment
# ($NATS_*_PASSWORD); nothing secret is stored in this file.
#
# This is the single-server configuration used by Compose. A three-node cluster
# adds `server_name`, a `cluster { ... routes [...] }` block and TLS, and runs the
# stream with NATS_STREAM_REPLICAS=3 (see the production section of the docs).

port: 4222
# Monitoring (/varz, /jsz, /connz). Compose publishes it on 127.0.0.1 only; never
# expose it publicly.
http_port: 8222
max_payload: 1MB

jetstream {
  store_dir: /data
  max_file_store: $NATS_JETSTREAM_MAX_FILE_STORE
  max_memory_store: 256MB
}

accounts {
  METEOR: {
    jetstream: enabled
    users: [
      # device-ingest: publishes device events and manages the METEOR_DEVICE stream.
      # It can never read events back.
      {
        user: ingest
        password: $NATS_INGEST_PASSWORD
        permissions: {
          publish: {
            allow: [
              "telemetry.v1.>", "device.status.v1.>", "device.events.v1.>",
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.METEOR_DEVICE",
              "$JS.API.STREAM.CREATE.METEOR_DEVICE",
              "$JS.API.STREAM.UPDATE.METEOR_DEVICE"
            ]
          }
          subscribe: { allow: ["_INBOX_device-ingest.>"] }
        }
      },
      # rule-processor: reads through its own durable consumer only; cannot publish events.
      {
        user: rules
        password: $NATS_RULES_PASSWORD
        permissions: {
          publish: {
            allow: [
              "$JS.API.INFO",
              "$JS.API.CONSUMER.CREATE.METEOR_DEVICE.rule-processor",
              "$JS.API.CONSUMER.CREATE.METEOR_DEVICE.rule-processor.>",
              "$JS.API.CONSUMER.INFO.METEOR_DEVICE.rule-processor",
              "$JS.API.CONSUMER.MSG.NEXT.METEOR_DEVICE.rule-processor",
              "$JS.ACK.METEOR_DEVICE.rule-processor.>"
            ]
          }
          subscribe: { allow: ["_INBOX_rule-processor.>"] }
        }
      },
      # clickhouse-writer: reads through its own durable consumer only.
      {
        user: chwriter
        password: $NATS_CHWRITER_PASSWORD
        permissions: {
          publish: {
            allow: [
              "$JS.API.INFO",
              "$JS.API.CONSUMER.CREATE.METEOR_DEVICE.clickhouse-writer",
              "$JS.API.CONSUMER.CREATE.METEOR_DEVICE.clickhouse-writer.>",
              "$JS.API.CONSUMER.INFO.METEOR_DEVICE.clickhouse-writer",
              "$JS.API.CONSUMER.MSG.NEXT.METEOR_DEVICE.clickhouse-writer",
              "$JS.ACK.METEOR_DEVICE.clickhouse-writer.>"
            ]
          }
          subscribe: { allow: ["_INBOX_clickhouse-writer.>"] }
        }
      },
      # Operators: the nats CLI for inspecting streams and consumers. Full access
      # inside this account; keep its password out of services.
      { user: admin, password: $NATS_ADMIN_PASSWORD }
    ]
  }
}
