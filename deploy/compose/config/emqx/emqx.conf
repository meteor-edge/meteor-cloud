node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "/opt/emqx/data"
}

listeners.tcp.default {
  enable = false
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.crt"
    certfile = "/opt/emqx/etc/certs/server.crt"
    keyfile = "/opt/emqx/etc/certs/server.key"
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

listeners.ws.default {
  enable = false
}

listeners.wss.default {
  enable = false
}

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://backend:8000/internal/mqtt/authenticate"
    headers {
      content-type = "application/json"
      x-mqtt-internal-token = "unset"
    }
    body {
      username = "${username}"
      password = "${password}"
    }
    ssl.enable = false
    connect_timeout = "5s"
    request_timeout = "5s"
  },
  # Application identities (username "app_<credential id>"). The control plane answers
  # "ignore" for them and the broker verifies the short-lived token the application
  # data plane signed: signature, username claim, expiry and the per-identity topic
  # ACL inside it. Disabled unless the data plane runs (EMQX_AUTHENTICATION__2__ENABLE
  # and EMQX_AUTHENTICATION__2__SECRET = DATAPLANE_MQTT_JWT_SECRET).
  {
    mechanism = jwt
    enable = false
    from = password
    use_jwks = false
    algorithm = "hmac-based"
    secret = "unset-unset-unset-unset-unset-unset"
    secret_base64_encoded = false
    verify_claims {
      username = "${username}"
    }
    acl_claim_name = "acl"
    disconnect_after_expire = true
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  cache {
    enable = false
  }
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://backend:8000/internal/mqtt/authorize"
      headers {
        content-type = "application/json"
        x-mqtt-internal-token = "unset"
      }
      body {
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
    }
  ]
}

dashboard {
  listeners.http {
    bind = 18083
  }
}
