node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "/opt/emqx/data"
}

listeners.tcp.default {
  enable = false
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.crt"
    certfile = "/opt/emqx/etc/certs/server.crt"
    keyfile = "/opt/emqx/etc/certs/server.key"
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

listeners.ws.default {
  enable = false
}

listeners.wss.default {
  enable = false
}

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://backend:8000/internal/mqtt/authenticate"
    headers {
      content-type = "application/json"
      x-mqtt-internal-token = "unset"
    }
    body {
      username = "${username}"
      password = "${password}"
    }
    ssl.enable = false
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  cache {
    enable = false
  }
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://backend:8000/internal/mqtt/authorize"
      headers {
        content-type = "application/json"
        x-mqtt-internal-token = "unset"
      }
      body {
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
    }
  ]
}

dashboard {
  listeners.http {
    bind = 18083
  }
}
