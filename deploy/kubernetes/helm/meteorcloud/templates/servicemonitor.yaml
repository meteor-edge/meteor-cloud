{{- if .Values.metrics.serviceMonitor.enabled }}
{{- $fullname := include "meteorcloud.fullname" . }}
{{- $components := list (dict "name" "backend" "port" "http") }}
{{- if .Values.mqtt.enabled }}{{ $components = append $components (dict "name" "data-plane" "port" "http") }}{{ end }}
{{- if .Values.dataApi.enabled }}{{ $components = append $components (dict "name" "data-api" "port" "ops") }}{{ end }}
{{- range $component := $components }}
---
# job="{{ $component.name }}" matches the bundled rules and dashboards.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}-{{ $component.name }}
  labels:
    {{- include "meteorcloud.componentLabels" (dict "ctx" $ "component" $component.name) | nindent 4 }}
    {{- with $.Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames: [{{ $.Release.Namespace | quote }}]
  selector:
    matchLabels:
      {{- include "meteorcloud.selectorLabels" (dict "ctx" $ "component" $component.name) | nindent 6 }}
  endpoints:
    - port: {{ $component.port }}
      path: /metrics
      interval: {{ $.Values.metrics.serviceMonitor.interval }}
      relabelings:
        - targetLabel: job
          replacement: {{ $component.name }}
{{- end }}
{{- end }}
