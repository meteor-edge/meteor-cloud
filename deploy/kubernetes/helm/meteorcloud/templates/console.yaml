{{- $fullname := include "meteorcloud.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-console
  labels:
    {{- include "meteorcloud.componentLabels" (dict "ctx" . "component" "console") | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicaCount }}
  selector:
    matchLabels:
      {{- include "meteorcloud.selectorLabels" (dict "ctx" . "component" "console") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meteorcloud.selectorLabels" (dict "ctx" . "component" "console") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # Static SPA served by nginx; it calls the API on the same origin, so
        # the Ingress must route /api to the backend.
        - name: console
          image: {{ include "meteorcloud.image" (dict "ctx" . "image" .Values.console.image) }}
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-console
  labels:
    {{- include "meteorcloud.componentLabels" (dict "ctx" . "component" "console") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "meteorcloud.selectorLabels" (dict "ctx" . "component" "console") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
