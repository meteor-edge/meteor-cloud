{{- if .Values.metrics.prometheusRule.enabled }}
# Rendered from files/rules/, a byte-identical copy of the Compose rules
# (deploy/compose/config/observability/rules), checked by tests/architecture.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "meteorcloud.fullname" . }}
  labels:
    {{- include "meteorcloud.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- range $file := list "files/rules/recording.yml" "files/rules/alerts.yml" }}
    {{- toYaml (get ($.Files.Get $file | fromYaml) "groups") | nindent 4 }}
    {{- end }}
{{- end }}
