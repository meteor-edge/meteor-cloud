{{- if .Values.mqtt.enabled }}
{{- $fullname := include "meteorcloud.fullname" . }}
{{- $secretName := include "meteorcloud.secretName" . }}
{{- $gateway := .Values.dataPlane.gateway | default "go" }}
{{- if not (has $gateway (list "go" "python")) }}
{{- fail "dataPlane.gateway must be go or python" }}
{{- end }}
{{- $go := eq $gateway "go" }}
{{- /* go: the MQTT forwarder binary from the data API image. python: the previous gateway. */}}
{{- $image := ternary .Values.dataApi.image .Values.dataPlane.image $go }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-data-plane
  labels:
    {{- include "meteorcloud.componentLabels" (dict "ctx" . "component" "data-plane") | nindent 4 }}
spec:
  # One forwarder at a time, and never two during a rollout (Recreate):
  # per-device order holds inside one process only, and the Go forwarder
  # resumes its broker session (fixed client ID) with the messages that
  # arrived while it restarted. The Python gateway processes every message
  # once per replica, so it needs one too.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "meteorcloud.selectorLabels" (dict "ctx" . "component" "data-plane") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meteorcloud.selectorLabels" (dict "ctx" . "component" "data-plane") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        # Talks to the control plane only over HTTP and to the broker over MQTT;
        # it gets just the MQTT credentials, not the API's database secrets.
        - name: data-plane
          image: {{ include "meteorcloud.image" (dict "ctx" . "image" $image) }}
          imagePullPolicy: {{ $image.pullPolicy }}
          {{- if $go }}
          command: ["mqtt-forwarder"]
          {{- end }}
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: CONTROL_PLANE_URL
              value: {{ printf "http://%s-backend:8000" $fullname | quote }}
            - name: HTTP_ADDR
              value: ":8081"
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | toString | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: MQTT_ENABLED
              value: "true"
            - name: MQTT_PROVIDER
              value: {{ .Values.mqtt.provider | quote }}
            - name: MQTT_BROKER_HOST
              value: {{ include "meteorcloud.mqttBrokerHost" . | quote }}
            - name: MQTT_BROKER_PORT
              value: {{ .Values.mqtt.port | toString | quote }}
            - name: MQTT_PLATFORM_USERNAME
              value: {{ .Values.mqtt.platformUsername | quote }}
            - name: MQTT_CA_CERT_PATH
              value: /certs/ca.crt
            - name: MQTT_PLATFORM_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $secretName }}, key: MQTT_PLATFORM_PASSWORD }
            - name: MQTT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $secretName }}, key: MQTT_INTERNAL_TOKEN }
            {{- if $go }}
            {{- range $k, $v := .Values.dataPlane.forwarder }}
            - name: {{ printf "MQTT_FORWARDER_%s" ($k | snakecase | upper) }}
              value: {{ $v | toString | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.dataPlane.resources | nindent 12 }}
          volumeMounts:
            - name: mqtt-ca
              mountPath: /certs
              readOnly: true
      {{- if $go }}
      # Queued messages are forwarded before exit (drainTimeout, 20 s by default).
      terminationGracePeriodSeconds: 40
      {{- end }}
      volumes:
        - name: mqtt-ca
          secret:
            secretName: {{ .Values.mqtt.tls.existingSecret }}
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-data-plane
  labels:
    {{- include "meteorcloud.componentLabels" (dict "ctx" . "component" "data-plane") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "meteorcloud.selectorLabels" (dict "ctx" . "component" "data-plane") | nindent 4 }}
  ports:
    - name: http
      port: 8081
      targetPort: http
{{- end }}
