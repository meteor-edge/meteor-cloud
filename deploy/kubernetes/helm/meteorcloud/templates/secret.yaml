{{- if not .Values.secrets.existingSecret }}
{{- $fullname := include "meteorcloud.fullname" . }}
{{- /* Reuse generated values on upgrade so passwords and tokens stay stable. */}}
{{- $previous := (lookup "v1" "Secret" .Release.Namespace $fullname).data | default dict }}
{{- $jwt := .Values.secrets.jwtSecret | default (get $previous "JWT_SECRET_KEY" | b64dec) | default (randAlphaNum 48) }}
{{- /* Generated once per render: DATABASE_URL and DATAPLANE_DATABASE_URL must carry the same password. */}}
{{- $pgPassword := .Values.postgresql.bundled.password | default (get $previous "POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "meteorcloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ $jwt | quote }}
  APP_SECRET_KEY: {{ $jwt | quote }}
  {{- $pg := .Values.postgresql }}
  {{- if eq $pg.mode "bundled" }}
  {{- $password := $pgPassword }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgresql:5432/%s" $pg.username (urlquery $password | replace "+" "%20") $fullname $pg.database | quote }}
  {{- else if $pg.external.url }}
  DATABASE_URL: {{ $pg.external.url | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s?sslmode=%s" $pg.username (urlquery $pg.external.password | replace "+" "%20") $pg.external.host $pg.external.port $pg.database $pg.external.sslmode | quote }}
  {{- end }}
  {{- if eq .Values.cache.provider "redis" }}
  {{- if eq .Values.cache.redis.mode "bundled" }}
  REDIS_URL: {{ printf "redis://%s-redis:6379/0" $fullname | quote }}
  {{- else }}
  REDIS_URL: {{ .Values.cache.redis.external.url | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.objectStorage.s3 }}
  {{- if and (eq $.Values.objectStorage.provider "s3") .accessKeyId }}
  OBJECT_STORAGE_ACCESS_KEY_ID: {{ .accessKeyId | quote }}
  OBJECT_STORAGE_SECRET_ACCESS_KEY: {{ .secretAccessKey | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.mqtt.enabled }}
  MQTT_PLATFORM_PASSWORD: {{ .Values.mqtt.platformPassword | default (get $previous "MQTT_PLATFORM_PASSWORD" | b64dec) | default (randAlphaNum 32) | quote }}
  MQTT_INTERNAL_TOKEN: {{ .Values.mqtt.internalToken | default (get $previous "MQTT_INTERNAL_TOKEN" | b64dec) | default (randAlphaNum 48) | quote }}
  {{- if and (eq .Values.mqtt.broker "bundled") (eq .Values.mqtt.provider "emqx") }}
  EMQX_DASHBOARD_PASSWORD: {{ .Values.mqtt.emqx.dashboardPassword | default (get $previous "EMQX_DASHBOARD_PASSWORD" | b64dec) | default (randAlphaNum 24) | quote }}
  EMQX_NODE_COOKIE: {{ get $previous "EMQX_NODE_COOKIE" | b64dec | default (randAlphaNum 48) | quote }}
  {{- end }}
  {{- end }}
  {{- if or .Values.dataApi.enabled .Values.nats.enabled }}
  DATA_PLANE_INTERNAL_TOKEN: {{ .Values.secrets.dataPlaneInternalToken | default (get $previous "DATA_PLANE_INTERNAL_TOKEN" | b64dec) | default (randAlphaNum 48) | quote }}
  {{- end }}
  {{- if .Values.dataApi.enabled }}
  {{- if eq .Values.dataApi.storage "postgres" }}
  {{- /* Go pgx wants postgres://; the API Secret key DATABASE_URL uses postgresql+psycopg://. */}}
  {{- if eq $pg.mode "bundled" }}
  {{- $password := $pgPassword }}
  DATAPLANE_DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s" $pg.username (urlquery $password | replace "+" "%20") $fullname $pg.database | quote }}
  {{- else if $pg.external.url }}
  {{- /* Operators using existingSecret should set DATAPLANE_DATABASE_URL themselves. */}}
  DATAPLANE_DATABASE_URL: {{ $pg.external.url | replace "postgresql+psycopg://" "postgres://" | replace "postgresql://" "postgres://" | quote }}
  {{- else }}
  DATAPLANE_DATABASE_URL: {{ printf "postgres://%s:%s@%s:%v/%s?sslmode=%s" $pg.username (urlquery $pg.external.password | replace "+" "%20") $pg.external.host $pg.external.port $pg.database $pg.external.sslmode | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.dataApi.mqtt.direct }}
  DATAPLANE_MQTT_JWT_SECRET: {{ .Values.dataApi.mqtt.jwtSecret | default (get $previous "DATAPLANE_MQTT_JWT_SECRET" | b64dec) | default (randAlphaNum 48) | quote }}
  {{- end }}
  {{- end }}
  {{- if or .Values.clickhouse.enabled .Values.nats.enabled }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | default (get $previous "CLICKHOUSE_PASSWORD" | b64dec) | default (randAlphaNum 32) | quote }}
  {{- end }}
  {{- if .Values.nats.enabled }}
  NATS_INGEST_PASSWORD: {{ .Values.nats.passwords.ingest | default (get $previous "NATS_INGEST_PASSWORD" | b64dec) | default (randAlphaNum 32) | quote }}
  NATS_RULES_PASSWORD: {{ .Values.nats.passwords.rules | default (get $previous "NATS_RULES_PASSWORD" | b64dec) | default (randAlphaNum 32) | quote }}
  NATS_CHWRITER_PASSWORD: {{ .Values.nats.passwords.chwriter | default (get $previous "NATS_CHWRITER_PASSWORD" | b64dec) | default (randAlphaNum 32) | quote }}
  NATS_ADMIN_PASSWORD: {{ .Values.nats.passwords.admin | default (get $previous "NATS_ADMIN_PASSWORD" | b64dec) | default (randAlphaNum 32) | quote }}
  {{- end }}
  {{- if eq .Values.connectivity.provider "wireguard" }}
  CONNECTIVITY_INTERNAL_TOKEN: {{ .Values.secrets.connectivityInternalToken | default (get $previous "CONNECTIVITY_INTERNAL_TOKEN" | b64dec) | default (randAlphaNum 48) | quote }}
  {{- end }}
  {{- with .Values.secrets.admin }}
  {{- if and .email .password }}
  EDGE_PLATFORM_ADMIN_EMAIL: {{ .email | quote }}
  EDGE_PLATFORM_ADMIN_PASSWORD: {{ .password | quote }}
  {{- end }}
  {{- end }}
{{- end }}
