{{- if not .Values.secrets.existingSecret }}
{{- $fullname := include "meteorcloud.fullname" . }}
{{- /* Reuse generated values on upgrade so passwords and tokens stay stable. */}}
{{- $previous := (lookup "v1" "Secret" .Release.Namespace $fullname).data | default dict }}
{{- $jwt := .Values.secrets.jwtSecret | default (get $previous "JWT_SECRET_KEY" | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "meteorcloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ $jwt | quote }}
  APP_SECRET_KEY: {{ $jwt | quote }}
  {{- $pg := .Values.postgresql }}
  {{- if eq $pg.mode "bundled" }}
  {{- $password := $pg.bundled.password | default (get $previous "POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 32) }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgresql:5432/%s" $pg.username (urlquery $password | replace "+" "%20") $fullname $pg.database | quote }}
  {{- else if $pg.external.url }}
  DATABASE_URL: {{ $pg.external.url | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s?sslmode=%s" $pg.username (urlquery $pg.external.password | replace "+" "%20") $pg.external.host $pg.external.port $pg.database $pg.external.sslmode | quote }}
  {{- end }}
  {{- if eq .Values.cache.provider "redis" }}
  {{- if eq .Values.cache.redis.mode "bundled" }}
  REDIS_URL: {{ printf "redis://%s-redis:6379/0" $fullname | quote }}
  {{- else }}
  REDIS_URL: {{ .Values.cache.redis.external.url | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.objectStorage.s3 }}
  {{- if and (eq $.Values.objectStorage.provider "s3") .accessKeyId }}
  OBJECT_STORAGE_ACCESS_KEY_ID: {{ .accessKeyId | quote }}
  OBJECT_STORAGE_SECRET_ACCESS_KEY: {{ .secretAccessKey | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.mqtt.enabled }}
  MQTT_PLATFORM_PASSWORD: {{ .Values.mqtt.platformPassword | default (get $previous "MQTT_PLATFORM_PASSWORD" | b64dec) | default (randAlphaNum 32) | quote }}
  MQTT_INTERNAL_TOKEN: {{ .Values.mqtt.internalToken | default (get $previous "MQTT_INTERNAL_TOKEN" | b64dec) | default (randAlphaNum 48) | quote }}
  {{- if eq .Values.mqtt.broker "bundled" }}
  EMQX_DASHBOARD_PASSWORD: {{ .Values.mqtt.emqx.dashboardPassword | default (get $previous "EMQX_DASHBOARD_PASSWORD" | b64dec) | default (randAlphaNum 24) | quote }}
  EMQX_NODE_COOKIE: {{ get $previous "EMQX_NODE_COOKIE" | b64dec | default (randAlphaNum 48) | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.secrets.admin }}
  {{- if and .email .password }}
  EDGE_PLATFORM_ADMIN_EMAIL: {{ .email | quote }}
  EDGE_PLATFORM_ADMIN_PASSWORD: {{ .password | quote }}
  {{- end }}
  {{- end }}
{{- end }}
