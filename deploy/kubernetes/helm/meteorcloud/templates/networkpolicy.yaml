{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "meteorcloud.fullname" . }}
# The API trusts X-Forwarded-* from any peer (config.forwardedAllowIps), so only
# this release's pods, the ingress controller, and extraFrom (for example the
# WireGuard gateway behind connectivity.gatewayService) may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "meteorcloud.componentLabels" (dict "ctx" $ "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "meteorcloud.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
        {{- with .Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 8000
          protocol: TCP
    {{- with .Values.metrics.networkPolicyFrom }}
    # Metrics scrapers (metrics.networkPolicyFrom). /metrics shares the API port, so these
    # peers can reach the API too: list only trusted monitoring pods, not whole namespaces
    # that run other workloads.
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 8000
          protocol: TCP
    {{- end }}
{{- if .Values.dataApi.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-data-api
  labels:
    {{- include "meteorcloud.componentLabels" (dict "ctx" $ "component" "data-api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "meteorcloud.selectorLabels" (dict "ctx" $ "component" "data-api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Public SDK traffic through the ingress controller (8082). Ops stays private.
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - port: 8082
          protocol: TCP
    # Control plane policy / command calls to the ops port.
    - from:
        - podSelector:
            matchLabels:
              {{- include "meteorcloud.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 14 }}
      ports:
        - port: 8092
          protocol: TCP
    {{- with .Values.metrics.networkPolicyFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 8092
          protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
