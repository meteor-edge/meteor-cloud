{{- if .Values.ingress.enabled }}
{{- $fullname := include "meteorcloud.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "meteorcloud.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - http:
        # Only the public API and health check reach the backend; /internal and
        # /metrics fall through to the console.
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-backend
                port: { name: http }
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ $fullname }}-backend
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-console
                port: { name: http }
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
