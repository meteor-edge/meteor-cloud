# MeteorCloud Helm chart. Installs into an existing cluster; it does not create
# or manage clusters, node pools, load balancers, DNS, or cloud databases.
#
# Every dependency is one of: bundled in this chart (for evaluation and small
# installs), or external (provided by you or your cloud). See README.md.

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# --- Application configuration (rendered into a ConfigMap) -----------------
config:
  appEnv: production
  # Public URL of the console/API, used for CORS. Example: https://fleet.example.com
  publicUrl: ""
  logLevel: INFO
  logFormat: json
  registrationRequireHttps: true
  # Anyone who reaches the console may create an account. Set false once your first
  # administrator exists (secrets.admin); people then join only when an admin adds them.
  allowSignup: true
  # Proxies whose X-Forwarded-Proto/For the API trusts (uvicorn FORWARDED_ALLOW_IPS).
  # The ingress terminates TLS, so without this every request looks like plain HTTP
  # and device registration fails with https_required. "*" also trusts any other pod
  # that can reach the API (it could fake https or its IP for rate limits): set the
  # ingress controller's pod CIDR here, or enable networkPolicy below.
  forwardedAllowIps: "*"
  # Extra non-secret environment variables for the API, e.g. rate limits:
  #   DEVICE_OFFLINE_THRESHOLD_SECONDS: "150"
  extraEnv: {}

# --- Secrets ---------------------------------------------------------------
# By default the chart creates a Secret and generates any value left empty
# (kept across upgrades). Set existingSecret to manage it yourself (Sealed
# Secrets, External Secrets, Vault, ...). Keys read from an existing Secret:
#   JWT_SECRET_KEY, APP_SECRET_KEY, DATABASE_URL     always
#   POSTGRES_PASSWORD                                postgresql.mode=bundled
#   REDIS_URL                                        cache.provider=redis
#   OBJECT_STORAGE_ACCESS_KEY_ID/SECRET_ACCESS_KEY   s3 with static keys (optional)
#   MQTT_PLATFORM_PASSWORD, MQTT_INTERNAL_TOKEN      mqtt.enabled
#   EMQX_DASHBOARD_PASSWORD, EMQX_NODE_COOKIE        bundled EMQX (mqtt.provider=emqx)
#   DATA_PLANE_INTERNAL_TOKEN                        dataApi.enabled or nats.enabled
#   DATAPLANE_DATABASE_URL                           dataApi.storage=postgres (postgres://..., not +psycopg)
#   DATAPLANE_MQTT_JWT_SECRET                        dataApi.mqtt.direct (32+ characters)
#   CLICKHOUSE_PASSWORD                              clickhouse.enabled or nats.enabled
#   NATS_*_PASSWORD                                  nats.enabled
#   EDGE_PLATFORM_ADMIN_EMAIL/PASSWORD               optional first administrator
#   CONNECTIVITY_INTERNAL_TOKEN                      connectivity.provider=wireguard
secrets:
  existingSecret: ""
  jwtSecret: ""
  # Shared by the control plane policy feed and the Go data API. Empty: generated.
  dataPlaneInternalToken: ""
  # Shared with the WireGuard gateway agent (EDGE_PLATFORM_CONNECTIVITY_INTERNAL_TOKEN).
  # Empty: generated once; read it back from the Secret for the gateway.
  connectivityInternalToken: ""
  admin:
    email: ""
    password: ""

# --- Device connectivity (WireGuard, optional) -----------------------------
# The WireGuard server runs outside the cluster on its own VM (AWS EC2 or
# on-prem), set up by deploy/ansible/playbooks/wireguard.yml. That playbook
# writes the values below to artifacts/wireguard-<gateway>/helm-values.yaml.
connectivity:
  provider: none             # none | wireguard
  wireguard:
    serverPublicKey: ""
    serverEndpoint: ""       # host:port devices dial, e.g. wg.example.com:51820
    serverAddress: 10.8.0.1/16
    clientCidr: 10.8.0.0/16
  # Private Service the gateway agent polls (/internal/connectivity/*). Keep it
  # internal: an internal load balancer restricted to the gateway's address.
  # Set vpn_control_plane_url on the gateway to http://<this address>:8000.
  gatewayService:
    enabled: false
    type: LoadBalancer
    annotations: {}
      # AWS (load balancer controller):
      # service.beta.kubernetes.io/aws-load-balancer-scheme: internal
      # service.beta.kubernetes.io/aws-load-balancer-type: external
      # service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    loadBalancerSourceRanges: []   # e.g. ["10.0.1.20/32"], the gateway's private IP
  # Browser SSH: the API pods ssh to each device's WireGuard IP, so pods need a
  # route to clientCidr through the gateway (vpn_routed_cidrs; EKS pod IPs are
  # VPC IPs). Devices install the public key into authorized_keys. Create the key:
  #   ssh-keygen -t ed25519 -N "" -C meteorcloud-shell-gateway -f id_ed25519
  #   kubectl -n meteorcloud create secret generic meteorcloud-shell \
  #     --from-file=id_ed25519 --from-file=id_ed25519.pub
  shell:
    provider: none           # none | ssh_gateway (needs provider=wireguard)
    existingSecret: ""       # Secret with id_ed25519 and id_ed25519.pub
    sshUser: root            # fallback when a device does not report its login
    # Short-lived per-session certificates. Add an SSH user CA to the same Secret:
    #   ssh-keygen -t ed25519 -N "" -C meteorcloud-ssh-ca -f ca
    #   ... --from-file=ca --from-file=ca.pub
    certificates: false
    # Once every device shows "SSH auth: certificate": stop handing out the shared key.
    gatewayKeyRetired: false
  # Public app hostnames shown to users: <app>.<device>.<org>.<baseDomain> or
  # <name>.<org>.<baseDomain>. reservedNames: comma-separated names already in use.
  # allowShortNames: also allow <name>.<baseDomain>, shared by all organizations.
  apps:
    baseDomain: meteor-edge.com
    reservedNames: ""
    allowShortNames: false
    # Serves the app hostnames: Traefik polls the backend's routing document
    # (/internal/routing/traefik) and gets wildcard certificates over DNS-01,
    # like the Compose deployment. Point *.<baseDomain> at its Service. Its
    # pods proxy to device WireGuard IPs, so they need the same route to
    # clientCidr through the gateway as browser SSH.
    proxy:
      enabled: false
      image:
        repository: traefik
        tag: v3.3
        pullPolicy: IfNotPresent
      service:
        type: LoadBalancer
        annotations: {}
        loadBalancerSourceRanges: []
      acme:
        email: ""
        dnsProvider: route53   # any Traefik/lego DNS provider
        # Secret with the provider's variables (e.g. AWS_ACCESS_KEY_ID,
        # AWS_SECRET_ACCESS_KEY, AWS_REGION). Leave empty with IRSA:
        # annotate serviceAccount instead.
        existingSecret: ""
        caServer: ""           # e.g. Let's Encrypt staging while testing
      persistence:
        size: 128Mi
        storageClass: ""
      resources: {}
      nodeSelector: {}
      tolerations: []

# --- PostgreSQL (required) -------------------------------------------------
postgresql:
  # bundled: single-instance StatefulSet in this release (no HA; optional nightly pg_dump below).
  # external: managed or customer PostgreSQL (Cloud SQL, RDS, Azure, on-prem).
  mode: bundled
  database: edge_platform
  username: edge
  bundled:
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    password: ""
    persistence:
      size: 8Gi
      storageClass: ""
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
    # Nightly pg_dump into its own volume (kept on helm uninstall), docs/backups.md.
    # Off by default because `helm install --wait` waits for the new volume, which many
    # storage classes bind only when the first backup job runs.
    backup:
      enabled: false
      schedule: "15 3 * * *"
      retentionDays: 7
      # Abort a stalled pg_dump so concurrencyPolicy: Forbid cannot skip forever.
      activeDeadlineSeconds: 3600
      persistence:
        size: 8Gi
        storageClass: ""
      resources: {}
  external:
    # Either a full SQLAlchemy URL (postgresql+psycopg://user:pass@host:5432/db?sslmode=require)
    url: ""
    # ...or the parts (password is URL-encoded by the chart).
    host: ""
    port: 5432
    password: ""
    sslmode: require

# --- Rate-limit cache (optional) -------------------------------------------
cache:
  # memory: per-API-pod counters, no extra service (fine for one replica).
  # redis: shared counters for several replicas.
  provider: memory
  redis:
    mode: bundled            # bundled | external
    external:
      url: ""                # rediss://:password@host:6379/0 (TLS required with credentials)
    image:
      repository: redis
      # Pin 7.2.x (BSD-3-Clause). Do not use floating "7" / "7-alpine" (tracks 7.4+ RSAL/SSPL).
      tag: "7.2-alpine"
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }

# --- Artifact storage (required, pick one) ---------------------------------
objectStorage:
  # filesystem: a PersistentVolumeClaim mounted into the API pod.
  # s3: AWS S3 or any S3-compatible API (MinIO, Ceph, Wasabi, R2, GCS
  #     interoperability with HMAC keys, customer storage).
  provider: filesystem
  filesystem:
    existingClaim: ""
    size: 20Gi
    storageClass: ""
    # ReadWriteMany (e.g. NFS, EFS, Filestore) allows backend.replicaCount > 1.
    accessModes: [ReadWriteOnce]
    # Keep the claim when the release is uninstalled.
    keep: true
  s3:
    endpointUrl: ""          # empty for AWS S3; https://storage.googleapis.com for GCS
    # Endpoint devices download from through presigned URLs. AWS S3 needs nothing here.
    # Other endpoints: set the address devices can reach (GCS, R2: same as endpointUrl).
    # Empty with a custom endpointUrl: downloads are streamed through the API.
    publicEndpointUrl: ""
    region: us-east-1
    bucket: ""
    autoCreateBucket: false
    # Leave empty to use the pod's identity (EKS IRSA / Pod Identity, see serviceAccount).
    accessKeyId: ""
    secretAccessKey: ""

# --- Device MQTT (optional) ------------------------------------------------
mqtt:
  enabled: false
  # bundled: one broker in this release. external: your own broker (or cluster),
  # configured to ask the API's /internal/mqtt endpoints for logins and topic
  # permissions (docs/fleet/mqtt.md).
  broker: bundled
  # Which broker software: mosquitto (default) | emqx | vernemq.
  #   mosquitto  Eclipse Mosquitto + meteorcloud_auth plugin, single node.
  #   emqx       EMQX 5.8.6 (Apache 2.0). Do not bump past 5.8 (docs/licensing.md).
  #   vernemq    external only: run VerneMQ yourself and set broker: external.
  provider: mosquitto
  # Hostname devices connect to (must be in the server certificate).
  publicHost: ""
  port: 8883
  platformUsername: platform
  platformPassword: ""
  internalToken: ""
  tls:
    # Secret with ca.crt (+ server.crt, server.key for the bundled broker). The
    # server certificate needs SANs for publicHost and the broker Service:
    # <release>-mqtt (mosquitto) or <release>-emqx (emqx).
    existingSecret: ""
  external:
    host: ""
  mosquitto:
    image:
      repository: ghcr.io/meteor-edge/meteorcloud-mosquitto
      tag: ""                  # defaults to the chart appVersion
      pullPolicy: IfNotPresent
    # How long the broker reuses an "allowed" topic decision (0 asks the API every time).
    aclCacheSeconds: 60
    service:
      # Devices reach 8883 through this Service. LoadBalancer needs a cloud or
      # bare-metal load balancer (MetalLB, k3s servicelb).
      type: LoadBalancer
      annotations: {}
      loadBalancerSourceRanges: []
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 512Mi }
  emqx:
    image:
      repository: emqx/emqx
      tag: "5.8.6"
      pullPolicy: IfNotPresent
    dashboardPassword: ""
    service:
      # Devices reach 8883 through this Service. LoadBalancer needs a cloud or
      # bare-metal load balancer (MetalLB, k3s servicelb).
      type: LoadBalancer
      annotations: {}
      loadBalancerSourceRanges: []
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }

# --- Workloads --------------------------------------------------------------
backend:
  image:
    repository: ghcr.io/meteor-edge/meteorcloud-backend
    tag: ""                  # defaults to the chart appVersion
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  nodeSelector: {}
  tolerations: []
  affinity: {}

console:
  image:
    repository: ghcr.io/meteor-edge/meteorcloud-console
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# MQTT gateway ("data-plane" Service on 8081, needs mqtt.enabled): device messages to the
# control plane, publish/watch API for it (contracts/mqtt-http.md).
dataPlane:
  # go: the Go MQTT forwarder, run from dataApi.image (default). python: the previous
  # gateway from dataPlane.image below, kept as a fallback for one release (1 replica).
  gateway: go
  # Always one replica, replaced with Recreate: see "One forwarder" in
  # docs/data-plane/mqtt-forwarder.md.
  # go only: MQTT_FORWARDER_* settings (docs/data-plane/mqtt-forwarder.md). Keys become
  # upper snake case, e.g. queueSize -> MQTT_FORWARDER_QUEUE_SIZE.
  forwarder: {}
    # workers: 16
    # queueSize: 4096
    # batchSize: 32
    # maxAttempts: 10
    # drainTimeout: 20s
  image:
    repository: ghcr.io/meteor-edge/meteorcloud-data-plane
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

# Application data API (Go): publish / subscribe / query / commands for the SDK.
# Off by default. Contract: contracts/data-plane-v1.md. Ingress PathPrefix /v1
# reaches port 8082; ops (8092: /readyz, /metrics, internal) stays ClusterIP only.
dataApi:
  enabled: false
  image:
    repository: ghcr.io/meteor-edge/meteorcloud-data-api
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # memory: single replica, no MQTT. mqtt: fan-out via the broker (needs mqtt.enabled).
  bus: memory
  # postgres: uses DATAPLANE_DATABASE_URL in the chart Secret (same DB, schema dataplane).
  # memory: in-process store (dev / tests only).
  storage: postgres
  mqtt:
    # Direct MQTT for applications (optional; the SDK works over HTTPS/WebSocket on
    # /v1 without it). The data API signs short-lived broker tokens that EMQX
    # verifies, so it needs bus=mqtt, mqtt.enabled and mqtt.provider=emqx: Mosquitto
    # and VerneMQ refuse app_ logins. A bundled EMQX gets the JWT authenticator;
    # an external EMQX needs the same secret configured by you (docs/kubernetes.md).
    direct: false
    # Signing secret, 32+ characters. Empty: generated once and kept across upgrades
    # (or DATAPLANE_MQTT_JWT_SECRET from secrets.existingSecret).
    jwtSecret: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# --- ClickHouse (optional; device history / data API storage) ---------------
# Off by default. Bundled single node for evaluation and small installs; set
# external.url for a managed ClickHouse. Apache 2.0 image (docs/licensing.md).
clickhouse:
  enabled: false
  image:
    repository: clickhouse/clickhouse-server
    tag: "25.8-alpine"
    pullPolicy: IfNotPresent
  database: meteorcloud
  username: meteorcloud
  password: ""                 # empty: generated once
  external:
    url: ""                    # e.g. http://clickhouse.example:8123
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }

# --- NATS JetStream device event path (optional) ----------------------------
# MQTT → device-ingest → JetStream METEOR_DEVICE → rule-processor / clickhouse-writer.
# Needs mqtt.enabled and ClickHouse (bundled or external). Docs: docs/data-plane/jetstream.md.
# Images come from dataApi.image (same meteorcloud/data-api binary).
nats:
  enabled: false
  image:
    repository: nats
    tag: "2.15.3-alpine"
    pullPolicy: IfNotPresent
  jetstream:
    maxFileStore: 20GB
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  stream:
    replicas: 1
    maxBytes: 10GB
    maxAge: 168h
    storage: file
    retention: limits
    discard: old
  passwords:
    ingest: ""
    rules: ""
    chwriter: ""
    admin: ""
  deviceIngest:
    replicaCount: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  ruleProcessor:
    replicaCount: 1
    workers: 8
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  clickhouseWriter:
    replicaCount: 1
    retentionDays: 0
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }

# --- Metrics (optional) -----------------------------------------------------
# The API and data plane serve Prometheus metrics on GET /metrics (their own
# ports, never routed by the ingress). Grafana, Loki and Prometheus are not part
# of this chart: use your cluster's monitoring (kube-prometheus-stack, Grafana
# Cloud, Datadog, ...). Dashboards ship in deploy/compose/config/observability.
metrics:
  # false: METRICS_ENABLED=false, /metrics returns 404 and nothing is recorded.
  enabled: true
  # ServiceMonitor for the Prometheus Operator (needs the monitoring.coreos.com CRDs).
  serviceMonitor:
    enabled: false
    interval: 30s
    # Labels your Prometheus selects on, e.g. { release: kube-prometheus-stack }
    labels: {}
  # The same recording and alert rules as the Compose bundle, as a PrometheusRule.
  prometheusRule:
    enabled: false
    labels: {}
  # With networkPolicy.enabled: peers allowed to scrape /metrics. /metrics is served on the
  # API port, so these peers can also reach the API: select only your Prometheus pods, e.g.
  #   - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
  #     podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
  networkPolicyFrom: []

serviceAccount:
  create: true
  name: ""
  # e.g. eks.amazonaws.com/role-arn for S3 access without static keys.
  annotations: {}

# --- Ingress ----------------------------------------------------------------
# Routes /api and /health to the API, /v1 to the application data API when
# dataApi.enabled, and everything else to the console. /internal, ops :8092 and
# /metrics are never routed. Needs an ingress controller in the cluster
# (Traefik, ingress-nginx, GKE, AWS Load Balancer Controller, ...).
# Lets only this release's pods and the ingress controller's namespace reach the
# API, so a forwardedAllowIps of "*" cannot be abused from elsewhere in the cluster.
# Off by default: it needs a CNI that enforces NetworkPolicy and the right selector.
networkPolicy:
  enabled: false
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  # More allowed peers, e.g. the WireGuard gateway VM when connectivity.gatewayService is on:
  #   - ipBlock: { cidr: 10.0.12.34/32 }
  extraFrom: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""                   # empty: match any host
  tls: []
  #  - secretName: meteorcloud-tls
  #    hosts: [fleet.example.com]
